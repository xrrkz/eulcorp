// -------- Home: cosmic horizon — perspective grid, glowing sun, starfield --------
function HomeBg() {
  const VANISH_X = 800;
  const HORIZON_Y = 540;

  // refs for scroll-driven parallax / warp motion
  const starsRef   = _s_R.useRef(null);
  const meteorsRef = _s_R.useRef(null);
  const orbitsRef  = _s_R.useRef(null);
  const sunRef     = _s_R.useRef(null);
  const gridRef    = _s_R.useRef(null);
  const horizonRef = _s_R.useRef(null);
  const skyRef     = _s_R.useRef(null);

  _s_R.useEffect(() => {
    let raf = 0;
    const apply = () => {
      const y  = window.scrollY || window.pageYOffset || 0;
      const vh = window.innerHeight || 1;
      // p ramps 0..1 across the first viewport, then keeps climbing softly
      const p = Math.min(y / vh, 1.4);
      const e = p < 1 ? p : 1 + (p - 1) * 0.4;

      if (starsRef.current)
        starsRef.current.style.transform = `translate3d(0, ${-e * 90}px, 0) scale(${1 + e * 0.18})`;
      if (meteorsRef.current)
        meteorsRef.current.style.transform = `translate3d(${e * 180}px, ${e * 70}px, 0)`;
      if (orbitsRef.current)
        orbitsRef.current.style.transform = `translate3d(0, ${e * 36}px, 0) rotate(${e * 6}deg)`;
      if (sunRef.current)
        sunRef.current.style.transform = `translate3d(0, ${e * 70}px, 0) scale(${Math.max(0.7, 1 - e * 0.28)})`;
      if (gridRef.current)
        gridRef.current.style.transform = `translate3d(0, ${e * 140}px, 0) scale(${1 + e * 0.12})`;
      if (horizonRef.current)
        horizonRef.current.style.transform = `translate3d(0, ${e * 28}px, 0)`;
      if (skyRef.current)
        skyRef.current.style.opacity = String(Math.max(0, 1 - e * 0.55));
    };
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; apply(); });
    };
    apply();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  const stars = _s_R.useMemo(() => {
    const rnd = (n) => {
      const x = Math.sin(n * 12.9898) * 43758.5453;
      return x - Math.floor(x);
    };
    return Array.from({ length: 120 }, (_, i) => ({
      cx: rnd(i + 1) * 1600,
      cy: rnd(i + 200) * (HORIZON_Y - 40),
      r:  0.5 + rnd(i + 300) * 1.4,
      op: 0.25 + rnd(i + 400) * 0.7,
      dur: 2.4 + rnd(i + 500) * 4.2,
      delay: -rnd(i + 600) * 6,
    }));
  }, []);

  const verticals = [];
  for (let i = -12; i <= 12; i++) {
    const bx = VANISH_X + i * 360;
    verticals.push(
      <line key={`v${i}`} x1={bx} y1={900} x2={VANISH_X} y2={HORIZON_Y}
            className={i === 0 ? "hbg-grid" : "hbg-grid-faint"} />
    );
  }

  const ROWS = 11;
  const rowDur = 7.2;
  const rows = Array.from({ length: ROWS }, (_, i) => {
    const begin = -(i * (rowDur / ROWS));
    return (
      <line key={`h${i}`} x1="0" x2="1600" y1={HORIZON_Y} y2={HORIZON_Y} className="hbg-grid">
        <animate attributeName="y1"
          values={`${HORIZON_Y};900`} keyTimes="0;1"
          calcMode="spline" keySplines="0.45 0 1 1"
          dur={`${rowDur}s`} begin={`${begin}s`} repeatCount="indefinite" />
        <animate attributeName="y2"
          values={`${HORIZON_Y};900`} keyTimes="0;1"
          calcMode="spline" keySplines="0.45 0 1 1"
          dur={`${rowDur}s`} begin={`${begin}s`} repeatCount="indefinite" />
        <animate attributeName="opacity"
          values="0;1;1;0" keyTimes="0;0.12;0.85;1"
          dur={`${rowDur}s`} begin={`${begin}s`} repeatCount="indefinite" />

    <rect
      key={`s${i}`}
      x={VANISH_X - 215} y={HORIZON_Y - 4}

    />

  const meteors = Array.from({ length: 3 }, (_, i) => {

      aria-hidden="true"
    >

const SCRAMBLE_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=<>/$";

function useScramble(target, opts = {}) {
  const { duration = 1500, settle = 80 } = opts;
  const [display, setDisplay] = React.useState(target);
  const [token, setToken] = React.useState(0);
  const trigger = React.useCallback(() => setToken((t) => t + 1), []);

  React.useEffect(() => {
    const len = target.length;
    // Each letter locks in at a staggered point inside `duration`.
    const lock = Array.from({ length: len }, (_, i) =>
    (i + 1) / len * (duration - settle) + Math.random() * settle
    );
    const start = performance.now();
    let raf;
    const tick = (now) => {
      const t = now - start;
      const next = target.split("").map((ch, i) => {
        if (ch === " ") return " ";
        if (t >= lock[i]) return ch;
        return SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
      });
      setDisplay(next.join(""));
      if (t < duration) raf = requestAnimationFrame(tick);else
      setDisplay(target);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, token, duration, settle]);

  return [display, trigger];
}

// Catmull-Rom → cubic Bezier path (buttery sparklines)
function _smoothPath(pts) {
  if (pts.length < 2) return "";
  const d = [`M${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d.push(`C${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`);
  }
  return d.join(" ");
}

// hex + alpha → rgba string
function hexA(hex, a) {
  const m = hex.replace("#", "");
  const r = parseInt(m.slice(0, 2), 16);
  const g = parseInt(m.slice(2, 4), 16);
  const b = parseInt(m.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

<script>
/* ============================================================
 * fx.js — scroll reveals, 3D card tilt, magnetic nav,
 *         chart-line title underlines, sparkline eyebrow ticks,
 *         price-decode principle numbers, P&L wordmark chip.
 *         Vanilla JS, runs after React mounts, idempotent via flags.
 * ============================================================ */
(function () {
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- 1. Split section titles into per-character spans ----------- */
  function splitTitles(root) {
    root.querySelectorAll('.section-title:not([data-split])').forEach((el) => {
      el.setAttribute('data-split', '1');
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
      const textNodes = [];
      let n;
      while ((n = walker.nextNode())) textNodes.push(n);
      let i = 0;
      textNodes.forEach((tn) => {
        const text = tn.textContent;
        const frag = document.createDocumentFragment();
        for (const c of text) {
          if (c === ' ') { frag.appendChild(document.createTextNode(' ')); continue; }
          const span = document.createElement('span');
          span.className = 'ch';
          span.style.setProperty('--ch-i', i++);
          span.textContent = c;
          frag.appendChild(span);
        }
        tn.replaceWith(frag);
      });
    });
  }

  /* ---- 2. Inject mini sparkline bars into each eyebrow ------------ */
  function injectSparklines(root) {
    root.querySelectorAll('.section-eyebrow:not([data-spark])').forEach((eb) => {
      eb.setAttribute('data-spark', '1');
      const spark = document.createElement('span');
      spark.className = 'eb-spark';
      spark.setAttribute('aria-hidden', 'true');
      for (let i = 0; i < 5; i++) spark.appendChild(document.createElement('span'));
      eb.appendChild(spark);
    });
  }

  /* ---- 3. Inject SVG chart-line underline after each title -------- */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  function injectTitleTape(root) {
    root.querySelectorAll('.section-title:not([data-tape])').forEach((title) => {
      title.setAttribute('data-tape', '1');
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('class', 'title-tape');
      svg.setAttribute('viewBox', '0 0 360 16');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      // chart-style polyline (mild uptrend with a small dip)
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('class', 'tt-path');
      path.setAttribute('d', 'M0 12 L60 10 L110 13 L160 7 L210 9 L260 4 L300 6 L340 2');
      svg.appendChild(path);
      // live-price ring + dot at the end of the line
      const ring = document.createElementNS(SVG_NS, 'circle');
      ring.setAttribute('class', 'tt-dot-ring');
      ring.setAttribute('cx', '340'); ring.setAttribute('cy', '2'); ring.setAttribute('r', '3');
      svg.appendChild(ring);
      const dot = document.createElementNS(SVG_NS, 'circle');
      dot.setAttribute('class', 'tt-dot');
      dot.setAttribute('cx', '340'); dot.setAttribute('cy', '2'); dot.setAttribute('r', '2.4');
      svg.appendChild(dot);
      // place after the title node so it doesn't interfere with .ch spans
      title.insertAdjacentElement('afterend', svg);
      // copy reveal delay var so dash + dot timing aligns with parent
      // (the SVG is a sibling, but its own [data-reveal] hop is handled below)
      svg.setAttribute('data-reveal', '');
      svg.style.setProperty('--reveal-delay', title.style.getPropertyValue('--reveal-delay') || '0ms');
    });
  }

  /* ---- 4. Tag elements as reveal targets, with parent-stagger ----- */
  const REVEAL_SELECTORS = [
    '.section-eyebrow',
    '.section-title',
    '.section-lede',
    '.principles li',
    '.cards .card',
    '.contact-grid .contact-row',
    '.contact-meta',
  ];
  function tagReveal(root) {
    REVEAL_SELECTORS.forEach((sel) => {
      root.querySelectorAll(sel).forEach((el) => {
        if (el.hasAttribute('data-reveal')) return;
        el.setAttribute('data-reveal', '');
        const parent = el.parentElement;
        if (!parent) return;
        const sibs = Array.from(parent.children).filter((s) =>
          s.matches('.section-eyebrow, .section-title, .section-lede, .principles > li, .contact-grid > .contact-row, .cards > .card, .contact-meta')
        );
        const ix = sibs.indexOf(el);
        if (ix >= 0) el.style.setProperty('--reveal-delay', `${ix * 90}ms`);
      });
    });
    // cards also get the "foundation rise" treatment
    root.querySelectorAll('.cards .card[data-reveal]:not(.fx-rise)').forEach((c) => {
      c.classList.add('fx-rise');
    });
  }

  /* ---- 5. IntersectionObserver to set .is-in on reveal targets ---- */
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        e.target.classList.add('is-in');
        // when a principles <li> reveals, scramble its number briefly
        if (e.target.matches('.principles li')) scramblePNum(e.target);
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

  function observeAll(root) {
    root.querySelectorAll('[data-reveal]:not(.is-in)').forEach((el) => io.observe(el));
  }

  /* ---- 6. Price-tape scramble for principles numbers -------------- */
  const SCRAMBLE_GLYPHS = '0123456789';
  function scramblePNum(li) {
    const num = li.querySelector('.p-num');
    if (!num || num.dataset.scrambleDone) return;
    num.dataset.scrambleDone = '1';
    const target = num.textContent.trim();
    if (!target.match(/^\d+$/)) return;
    num.classList.add('is-scrambling');
    const start = performance.now();
    const dur = 520;
    function tick(now) {
      const t = now - start;
      const out = target.split('').map((c, i) => {
        const lock = (i + 1) * (dur / (target.length + 1));
        if (t >= lock) return c;
        return SCRAMBLE_GLYPHS[Math.floor(Math.random() * SCRAMBLE_GLYPHS.length)];
      }).join('');
      num.textContent = out;
      if (t < dur) requestAnimationFrame(tick);
      else { num.textContent = target; num.classList.remove('is-scrambling'); }
    }
    requestAnimationFrame(tick);
  }

  /* ---- 7. Card spotlight + 3D tilt -------------------------------- */
  function attachCardFX(card) {
    if (card.__fx) return; card.__fx = true;
    const TILT_MAX = 6;
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      card.style.setProperty('--mx', `${px * 100}%`);
      card.style.setProperty('--my', `${py * 100}%`);
      if (!REDUCED) {
        card.style.setProperty('--tilt-y', `${(px - 0.5) * 2 * TILT_MAX}deg`);
        card.style.setProperty('--tilt-x', `${-(py - 0.5) * 2 * TILT_MAX}deg`);
      }
    });
    card.addEventListener('pointerleave', () => {
      card.style.setProperty('--tilt-x', '0deg');
      card.style.setProperty('--tilt-y', '0deg');
    });
  }

  /* ---- 8. Contact row spotlight (left → right ribbon) ------------- */
  function attachRowFX(row) {
    if (row.__fx) return; row.__fx = true;
    row.addEventListener('pointermove', (e) => {
      const r = row.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      row.style.setProperty('--mx', `${px * 100}%`);
    });
  }

  /* ---- 9. Magnetic nav + social links ----------------------------- */
  function attachMagnetic(el, strength) {
    if (el.__mag) return; el.__mag = true;
    const r0 = () => el.getBoundingClientRect();
    el.addEventListener('pointermove', (e) => {
      const r = r0();
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      el.style.setProperty('--mag-x', `${dx * strength}px`);
      el.style.setProperty('--mag-y', `${dy * strength}px`);
    });
    el.addEventListener('pointerleave', () => {
      el.style.setProperty('--mag-x', '0px');
      el.style.setProperty('--mag-y', '0px');
    });
  }

  /* ---- 10. Wordmark glitch + P&L flash chip ---------------------- */
  function attachWordmarkFX(root) {
    // glitch on hover
    root.querySelectorAll('.wordmark:not([data-glitch-bound])').forEach((el) => {
      el.setAttribute('data-glitch-bound', '1');
      el.addEventListener('pointerenter', () => el.classList.add('is-glitch'));
      el.addEventListener('pointerleave', () => el.classList.remove('is-glitch'));
    });
    // P&L flash chip hovering above the wordmark frame
    root.querySelectorAll('.wordmark-frame:not([data-pnl])').forEach((frame) => {
      frame.setAttribute('data-pnl', '1');
      const chip = document.createElement('span');
      chip.className = 'wm-pnl';
      chip.setAttribute('aria-hidden', 'true');
      chip.innerHTML = '<span class="val">+1.34%</span><span class="arr">▲</span>';
      frame.appendChild(chip);
      // randomize a fresh "tick" each time the user enters
      frame.addEventListener('pointerenter', () => {
        const up = Math.random() > 0.32;
        const pct = (Math.random() * 2.4 + 0.05).toFixed(2);
        chip.querySelector('.val').textContent = (up ? '+' : '-') + pct + '%';
        chip.querySelector('.arr').textContent = up ? '▲' : '▼';
        chip.style.background = up ? '#ffffff' : 'rgba(255,255,255,0.78)';
      });
    });
  }

  /* ---- decorate runner -------------------------------------------- */
  function decorate(root) {
    splitTitles(root);
    injectSparklines(root);
    tagReveal(root);            // sets --reveal-delay on titles/eyebrows/etc.
    injectTitleTape(root);      // copies that delay onto the chart-line SVG
    observeAll(root);
    root.querySelectorAll('.cards .card').forEach(attachCardFX);
    root.querySelectorAll('.contact-grid .contact-row').forEach(attachRowFX);
    root.querySelectorAll('.nav-link').forEach((el) => attachMagnetic(el, 0.22));
    root.querySelectorAll('.socials a').forEach((el) => attachMagnetic(el, 0.18));
    attachWordmarkFX(root);
  }

  function init() {
    const root = document.getElementById('root') || document.body;
    decorate(root);
    // React reconciles in place, but new nodes can still appear (tweaks panel, etc).
    // Re-run decoration whenever the tree changes.
    const mo = new MutationObserver(() => decorate(root));
    mo.observe(root, { childList: true, subtree: true });
  }

  /* Run immediately so MutationObserver is wired up BEFORE React mounts the
   * tree. This way reveal/rise classes are applied within the same task that
   * inserts the nodes — no flash of fully-visible cards followed by a
   * fade-out. We also re-run after DOMContentLoaded as a safety net. */
  init();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('root') || document.body;
      decorate(root);
    });
  }
})();
</script>
